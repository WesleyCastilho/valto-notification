name: Validate Valto Notification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: valto_test
          POSTGRES_PASSWORD: valto_test
          POSTGRES_DB: valto_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U valto_test -d valto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://valto_test:valto_test@localhost:5432/valto_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: go mod tidy
      - run: gofmt -w cmd internal sdk
      - run: go vet ./...
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - run: go build ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t valto-notification:test .
