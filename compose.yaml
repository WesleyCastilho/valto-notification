services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: valto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: valto
    volumes:
      - valto-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valto -d valto"]
      interval: 5s
      timeout: 3s
      retries: 10
  notification:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  valto-data:
